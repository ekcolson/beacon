name: beacon_app
description: Simple Beacon MVP app
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  amplify_api: ^2.6.1
  amplify_auth_cognito: ^2.6.1
  amplify_flutter: ^2.6.1
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  # The 2.0x/3.0x variants beside these are picked up automatically. The SVG
  # sources in assets/beacon/src are deliberately not listed: they are the art's
  # source of truth, not something to ship in the bundle.
  assets:
    - assets/beacon/beacon_lit.png
    - assets/beacon/beacon_unlit.png
